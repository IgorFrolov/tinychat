[package]
name = "tinychat"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A minimal full-screen TUI client for OpenAI-compatible Chat Completions APIs"
license = "MIT"

[dependencies]
anyhow = "=1.0.95"
clap = { version = "=4.5.27", features = ["derive"] }
crossterm = { version = "=0.28.1", features = ["event-stream"] }
futures-util = "=0.3.31"
idna_adapter = "=1.0.0"
indexmap = "=2.7.1"
instability = "=0.3.1"
pulldown-cmark = "=0.12.2"
ratatui = "=0.29.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.137"
smawk = "=0.3.2"
textwrap = "=0.16.1"
thiserror = "=2.0.11"
tokio = { version = "=1.43.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "=0.7.13"
unicode-segmentation = "=1.12.0"
unicode-width = "=0.2.0"
url = "=2.5.4"

[patch.crates-io]
# Keep modifier shortcuts tied to the physical/base-layout key reported by
# the Kitty keyboard protocol. Upstream crossterm 0.28 discards that field.
crossterm = { path = "vendor/crossterm" }
